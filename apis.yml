aid: rest-countries
name: REST Countries
kind: opensource
description: >-
  REST Countries is a free, open-source RESTful API that returns rich country reference data — ISO 3166-1 codes (cca2,
  cca3, ccn3, cioc), common/official and native names, translations, capitals, regions and subregions, continents,
  currencies, languages, calling codes, top-level domains, timezones, geographic coordinates, borders, area, population,
  demonyms, flags and coats of arms, postal code formats, Gini index, FIFA code, independence and UN membership status,
  driving side, and start of week. The canonical hosted instance runs at restcountries.com (v3.1) and the source is
  community-maintained at github.com/apilayer/restcountries (mirror of gitlab.com/restcountries/restcountries), licensed
  under MPL-2.0. The hosted API is unauthenticated and free; for production use the project encourages self-hosting from
  source.
url: https://raw.githubusercontent.com/api-evangelist/rest-countries/main/apis.yml
accessModel:
  pricing: free
  onboarding: unknown
  trial: false
  try_now: false
  public: false
  label: Free
  confidence: medium
  source:
